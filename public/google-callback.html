<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signing in — Daily Dividend</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f0f0e;color:#f5f1e8;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
    main{text-align:center;max-width:380px}
    .mark{width:48px;height:48px;border-radius:14px;margin:0 auto 20px;display:grid;place-items:center;background:#f5f1e8;color:#0f0f0e;font-family:Georgia,serif;font-weight:700}
    h1{font:500 30px/1.15 Georgia,serif;margin:0 0 10px}
    p{margin:0;color:rgba(245,241,232,.62);line-height:1.55}
    .error{color:#fcc9c2}
  </style>
</head>
<body>
  <main>
    <div class="mark">DD</div>
    <h1 id="title">Signing you in…</h1>
    <p id="status">Connecting your Google account securely.</p>
  </main>
  <script>
    (async function(){
      const title=document.getElementById('title');
      const status=document.getElementById('status');
      try{
        const params=new URLSearchParams(location.hash.slice(1));
        const error=params.get('error_description')||params.get('error');
        if(error)throw new Error(error);
        const accessToken=params.get('access_token');
        const refreshToken=params.get('refresh_token');
        if(!accessToken||!refreshToken)throw new Error('Google did not return a login session.');
        let onboarding={};
        try{onboarding=JSON.parse(sessionStorage.getItem('ddGoogleOnboarding')||'{}');}catch(e){}
        const response=await fetch('/api/auth/google-session',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            accessToken,
            refreshToken,
            expiresIn:Number(params.get('expires_in'))||3600,
            ageRange:onboarding.ageRange||'',
            investorLevel:onboarding.investorLevel||''
          })
        });
        const data=await response.json().catch(()=>({}));
        if(!response.ok)throw new Error(data.error||'Google login could not be completed.');
        if(data.user&&data.user.userId){
          localStorage.setItem('dailyDividendUserId',data.user.userId);
          localStorage.setItem('user',JSON.stringify(data.user));
          localStorage.setItem('dailyDividendOnboarded','true');
        }
        sessionStorage.removeItem('ddGoogleOnboarding');
        const returnTo=sessionStorage.getItem('ddGoogleReturnTo')==='/testing123'?'/testing123':'/';
        sessionStorage.removeItem('ddGoogleReturnTo');
        location.replace(returnTo);
      }catch(error){
        title.textContent='Could not sign in';
        status.textContent=error.message+' Go back and try again.';
        status.className='error';
      }
    })();
  </script>
</body>
</html>
