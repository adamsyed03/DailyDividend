<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="/api/brand-logo">
  <title>Daily Dividend - Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#fafaf7;
      --paper:#fff;
      --ink:#0a0a0a;
      --ink2:#1f1f1f;
      --muted:#6b7280;
      --muted2:#9ca3af;
      --bd:#e8e5dc;
      --bd2:#d8d3c4;
      --grn:#0f9d6b;
      --grn-soft:#e6f7ef;
      --red:#d63939;
      --red-soft:rgba(214,57,57,.1);
      --red-br:rgba(214,57,57,.22);
      --serif:Georgia,"Times New Roman",serif;
      --sans:Arial,"Helvetica Neue",sans-serif;
      --mono:ui-monospace,monospace;
      --fx:cubic-bezier(.2,.8,.2,1);
    }
    html,body{height:100%;background:var(--bg)}
    body{min-height:100vh;font-family:var(--sans);color:var(--ink);display:grid;place-items:center;padding:16px;-webkit-font-smoothing:antialiased}
    .card{width:min(95vw,360px);background:var(--paper);border:1px solid var(--bd2);border-radius:12px;padding:20px;box-shadow:0 12px 32px rgba(10,10,10,.08)}
    .brand{display:flex;align-items:center;gap:8px;margin-bottom:20px}
    .brand-mark{width:auto;height:auto;background:transparent;color:var(--ink);display:block;font-family:var(--serif);font-weight:700;font-size:21px;line-height:1;letter-spacing:-.05em}
    .brand-name{font-weight:700;letter-spacing:-.01em;font-size:14px}
    .kicker{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--grn);margin-bottom:8px}
    h1{font-family:var(--serif);font-size:28px;line-height:1.12;margin-bottom:6px;letter-spacing:-.02em}
    .sub{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:18px}
    .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
    label{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    input{font:inherit;font-size:14px;border:1px solid var(--bd2);border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;width:100%}
    input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(15,157,107,.12)}
    input::placeholder{color:var(--muted2)}
    .hint{font-size:11px;color:var(--muted);line-height:1.4;margin:-2px 0 12px}
    button{width:100%;border:0;border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:600;font-size:14px;padding:12px 16px;cursor:pointer;transition:transform .15s,background .15s}
    button:hover{background:var(--grn);transform:translateY(-1px)}
    button:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .google-login{width:100%;border:1px solid var(--bd2);border-radius:999px;background:#fff;color:#202124;font:inherit;font-weight:600;font-size:14px;padding:11px 16px;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;transition:transform .15s,box-shadow .15s;margin-bottom:14px}
    .google-login:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(10,10,10,.08)}
    .google-login svg{width:18px;height:18px;flex:0 0 18px}
    .oauth-divider{display:flex;align-items:center;gap:10px;color:var(--muted2);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin:0 0 14px}
    .oauth-divider::before,.oauth-divider::after{content:"";height:1px;background:var(--bd2);flex:1}
    .message{display:none;margin-top:12px;border-radius:10px;padding:11px 12px;font-size:12px;line-height:1.4}
    .message.show{display:block}
    .message.error{background:var(--red-soft);color:var(--red);border:1px solid var(--red-br)}
    .message.success{background:var(--grn-soft);color:#0b6e4b;border:1px solid rgba(15,157,107,.24)}
    .switch{margin-top:14px;text-align:center;font-size:13px;color:var(--muted)}
    .switch a{color:var(--ink);font-weight:600;text-decoration:none;transition:color .15s}
    .switch a:hover{color:var(--grn)}
    
    @media(min-width:640px){
      .card{width:min(460px,100%);padding:28px}
      h1{font-size:32px}
      .sub{font-size:15px;margin-bottom:20px}
      button{padding:13px 18px;font-size:15px}
      .message{font-size:13px}
      .switch{font-size:14px;margin-top:16px}
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">DD</div>
      <div class="brand-name">Daily Dividend</div>
    </div>

    <div class="kicker">Member Login</div>
    <h1>Welcome back.</h1>
    <p class="sub">Log in with your email and password.</p>

    <a class="google-login" href="/api/auth/google" onclick="sessionStorage.removeItem('ddGoogleOnboarding');sessionStorage.setItem('ddGoogleReturnTo',/^\/testing123(?:\/|$)/.test(location.pathname)?'/testing123':'/')">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.638-.057-1.252-.164-1.841H9v3.482h4.844a4.14 4.14 0 0 1-1.797 2.715v2.258h2.909c1.703-1.568 2.684-3.878 2.684-6.614Z"/><path fill="#34A853" d="M9 18c2.43 0 4.468-.806 5.956-2.181l-2.91-2.258c-.805.54-1.835.859-3.046.859-2.344 0-4.328-1.585-5.037-3.714H.956v2.332A9 9 0 0 0 9 18Z"/><path fill="#FBBC05" d="M3.963 10.706A5.41 5.41 0 0 1 3.68 9c0-.592.102-1.168.283-1.706V4.962H.956A9 9 0 0 0 0 9c0 1.452.347 2.827.956 4.038l3.007-2.332Z"/><path fill="#EA4335" d="M9 3.58c1.322 0 2.508.454 3.441 1.346l2.581-2.581C13.464.892 11.426 0 9 0A9 9 0 0 0 .956 4.962l3.007 2.332C4.672 5.165 6.656 3.58 9 3.58Z"/></svg>
      Log in with Google
    </a>
    <div class="oauth-divider">or use email</div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="login-button" type="submit">Login</button>
      <div class="message" id="message" role="status"></div>
    </form>

    <p class="switch">No account yet? <a href="onboarding.html">Sign up</a></p>
  </main>

  <script src="js/dd-backend.js"></script>
  <script>
    const form = document.getElementById('login-form');
    const button = document.getElementById('login-button');
    const message = document.getElementById('message');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = 'message show ' + type;
    }

    function isSuccess(data) {
      const status = String(data.status || data.result || data.message || '').toLowerCase();
      return data.ok === true || data.success === true || status === 'ok' || status === 'success';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showMessage('Please enter your email and password.', 'error');
        return;
      }

      button.disabled = true;
      button.textContent = 'Logging in...';

      try {
        const { response, data } = await ddFetchJson({mode:'login', email, password}, 'Login request');

        if (!response.ok || !isSuccess(data)) {
          throw new Error(data.error || data.reason || 'No account matched those details.');
        }

        const user = data.user || {email};
        if (user.userId) {
          localStorage.setItem('dailyDividendUserId', user.userId);
        }
        localStorage.setItem('user', JSON.stringify(user));
        showMessage('Login successful. Redirecting...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 500);
      } catch (error) {
        showMessage(error.message || 'Login failed. Please try again.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Login';
      }
    });
  </script>
  <script src="js/analytics.js"></script>
</body>
</html>
